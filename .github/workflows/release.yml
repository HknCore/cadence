# Baut bei jedem Versions-Tag (z. B. v0.2.2) den Installer und veroeffentlicht ihn unter "Releases".
# Manuell starten geht auch: Actions -> Release -> Run workflow (dann nur als Download-Artefakt).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version bestimmen
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $props = Get-Content Directory.Build.props -Raw
            $v = [regex]::Match($props, "<Version>([^<]+)</Version>").Groups[1].Value
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Inno Setup installieren
        shell: pwsh
        run: |
          $have = Get-ChildItem "${env:ProgramFiles}\Inno Setup*\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $have) { choco install innosetup -y --no-progress }

      - name: Bauen und Installer erstellen
        shell: pwsh
        run: ./build-installer.ps1 -Version ${{ steps.ver.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-Setup-${{ steps.ver.outputs.version }}
          path: build/installer/*.exe

      - name: Release veroeffentlichen
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Cadence ${{ steps.ver.outputs.version }}
          files: build/installer/*.exe
          generate_release_notes: true
